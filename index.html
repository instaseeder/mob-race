const cvs=document.getElementById("c"),ctx=cvs.getContext("2d");
let W,H,dpr,playerX=0.5,speed=7,roadOffset=0,distance=0,started=false,gameOver=false;
const racers=[
 {name:"Racer 1",x:.30,color:"#e53935",crop:[185,230,105,120]},
 {name:"Racer 2",x:.43,color:"#7b1fa2",crop:[470,285,90,105]},
 {name:"Racer 3",x:.56,color:"#00897b",crop:[550,300,90,105]},
 {name:"Racer 4",x:.69,color:"#fb8c00",crop:[640,300,90,105]},
 {name:"Racer 5",x:.34,color:"#3949ab",crop:[775,285,100,115]},
 {name:"Racer 6",x:.57,color:"#c62828",crop:[910,300,100,115]},
 {name:"Racer 7",x:.73,color:"#00838f",crop:[1040,285,105,120]}
];
// The blue-shirt/black-cap person (2nd person in the source photo) is intentionally not used.
let cars=racers.map((r,i)=>({ ...r, y:-100-i*190, baseX:r.x, phase:i*1.7 }));

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

function road(){
 ctx.fillStyle="#4d8a3a";ctx.fillRect(0,0,W,H);
 const rw=Math.min(W*.72,650),rx=(W-rw)/2;
 ctx.fillStyle="#303236";ctx.fillRect(rx,0,rw,H);
 ctx.fillStyle="#f4f4f4";ctx.fillRect(rx,0,7,H);ctx.fillRect(rx+rw-7,0,7,H);
 roadOffset=(roadOffset+speed)%90;
 ctx.fillStyle="#fff";
 for(let y=roadOffset-90;y<H;y+=90){ctx.fillRect(rx+rw/3,y,7,48);ctx.fillRect(rx+rw*2/3,y,7,48)}
 return {rx,rw};
}
function face(cx,cy,r,crop){
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
 const [sx,sy,sw,sh]=crop;
 ctx.drawImage(img,sx,sy,sw,sh,cx-r,cy-r,r*2,r*2);
 ctx.restore();
}
function car(x,y,r,scale=1){
 const w=66*scale,h=104*scale;
 ctx.fillStyle=r.color;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,14*scale);ctx.fill();
 ctx.fillStyle="#111";ctx.beginPath();ctx.roundRect(x-w*.34,y-h*.30,w*.68,h*.23,7*scale);ctx.fill();
 ctx.fillStyle="#171717";ctx.fillRect(x-w*.60,y-h*.22,8*scale,27*scale);ctx.fillRect(x+w*.48,y-h*.22,8*scale,27*scale);
 ctx.fillStyle="#ddd";ctx.fillRect(x-w*.32,y+h*.25,w*.64,5*scale);
 face(x,y-h*.55,20*scale,r.crop);
}
function hud(){
 ctx.fillStyle="#fff";ctx.font="900 25px Arial";ctx.textAlign="left";ctx.fillText("🏁 RIDE TOGETHER",18,34);
 ctx.font="700 13px Arial";ctx.fillText("RACE FOREVER",20,53);
 ctx.fillStyle="#000b";ctx.fillRect(16,68,178,214);
 ctx.fillStyle="#fff";ctx.font="800 15px Arial";ctx.fillText("LEADERBOARD",28,92);
 racers.forEach((r,i)=>{ctx.fillStyle=i===0?"#ffd54f":"#fff";ctx.font="700 14px Arial";ctx.fillText((i+1)+". "+r.name,28,118+i*23)});
 ctx.fillStyle="#000c";ctx.fillRect(W-170,18,150,64);
 ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="900 19px Arial";ctx.fillText("LAP 1 / 3",W-95,44);ctx.font="700 12px Arial";ctx.fillText("POSITION 1 / 7",W-95,65);
 ctx.beginPath();ctx.arc(W-82,H-82,61,0,Math.PI*2);ctx.fillStyle="#000b";ctx.fill();
 ctx.fillStyle="#fff";ctx.font="900 24px Arial";ctx.fillText(Math.round(speed*22)+"",W-82,H-86);ctx.font="700 11px Arial";ctx.fillText("KM/H",W-82,H-66);
}
function startScreen(){
 ctx.fillStyle="#0009";ctx.fillRect(0,0,W,H);
 ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="900 42px Arial";ctx.fillText("RIDE TOGETHER",W/2,H*.35);
 ctx.font="900 24px Arial";ctx.fillStyle="#ffd400";ctx.fillText("RACE FOREVER",W/2,H*.35+38);
 ctx.fillStyle="#fff";ctx.font="700 17px Arial";ctx.fillText("Tap to start",W/2,H*.58);
}
function loop(){
 road();
 const {rx,rw}=road();
 cars.forEach((o,i)=>{
   o.y+=speed+(i%2);
   o.x=o.baseX+Math.sin((distance/45)+o.phase)*.025;
   if(o.y>H+130){o.y=-180-Math.random()*300;o.baseX=[.28,.40,.52,.64,.76][Math.floor(Math.random()*5)];}
   car(rx+o.x*rw,o.y,o,.92);
 });
 // player
 let target=rx+playerX*rw;
 const p={...racers[0],crop:racers[0].crop,color:"#00a86b"};
 car(target,H-125,p,1.15);
 hud();
 if(!started)startScreen();
 if(!started||gameOver)return;
 distance+=speed;
 requestAnimationFrame(loop);
}
function begin(){if(!started){started=true;document.getElementById("help").style.display="block";requestAnimationFrame(loop)}}
function steer(dir){begin();playerX=Math.max(.08,Math.min(.92,playerX+dir*.075))}
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")steer(-1);if(e.key==="ArrowRight"||e.key==="d")steer(1);if(e.key===" " )begin()});
addEventListener("pointerdown",e=>{steer(e.clientX<innerWidth/2?-1:1)});
img.onload=()=>{loop()};
</script>
